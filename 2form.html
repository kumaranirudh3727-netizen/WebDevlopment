<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form in html</title>
    <link rel="stylesheet" href="rgb.css">
</head>

<body>

    <h1>
        Form in html <br> This web page is created by
        <span>Anirudh kumar</span>
    </h1>

    <form action="#" method="post">

        <label>Username:</label>
        <input type="text" name="username" placeholder="Enter Your User Name">
        <br><br>

        <label>Mobile Number:</label>
        <input type="tel" name="mobile_number" placeholder="Enter Your Mobile number">
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter Your Email">
        <br><br>

        <label>Password:</label>
        <input type="password" name="password" placeholder="Enter Your Email Password">
        <br><br>

        <label>Age:</label>
        <input type="number" name="Age" min="1" max="100">
        <br><br>

        <label>Education:</label>
        <input type="radio" name="education" value="yes"> Yes
        <input type="radio" name="education" value="no"> No
        <br><br>

        <input type="submit" value="Submit">
    </form>

    <br><br>

    <audio controls>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <br>

    <a href="https://www.youtube.com/watch?v=mwFGCLIJJ7k&list=RDmwFGCLIJJ7k&start_radio=1">youtube song video link</a>
    <br><br>

    <video width="400" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <br><br>

    <p>ambient youtube video</p>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/aKaJe_3mr6k?si=p0FmyP__kXtAQ53x"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>
</html>
