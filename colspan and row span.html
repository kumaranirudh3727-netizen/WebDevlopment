<!Doctype html>
<html lan="en" >

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table using by span</title>
    <style>
        table,
        th,
        td {
            border: 3px solid black;
            border-collapse: collapse;
        }
    </style>

</head>

<body>
    <table>
        <tr>
            <th colspan="5" style="text-align: center;">Room triff</th>
        </tr>
        <tr>
            <th rowspan="3">Room type</th>
            <th colspan="2">deluxe</th>
            <th colspan="2">execution</th>
        </tr>
        <tr>
            <th>ac</th>
            <th>non ac</th>
            <th>ac</th>
            <th>non ac</th>
        </tr>
        <tr>
            <td>2000</td>
            <td>1500</td>
            <td>3000</td>
            <td>2500</td>
    </table>
    
    <hr>

    <table>
        <tr>
            <th rowspan="3">name</th>
            <th colspan="2">class</th>
            <th rowspan="3">college</th>
        </tr>
        <tr>
            <th>m.tech</th>
            <th>MCA</th>
        </tr>
        <tr>
            <td>Deepak</td>
            <td>sonu</td>
            <td>sityog</td>
        </tr>
    </table>
    <hr>
    <table>
        <tr>
            <th rowspan="3">day</th>
        </tr>
        <tr>
            <th colspan="2">Monday</th>

        </tr>
        <tr>
            <th>morning</th>
            <th>evening</th>
        </tr>
        <tr>
            <td>monday</td>
            <td>math</td>
            <td>science</td>

        </tr>
        <tr>
            <td>tuesday</td>
            <td colspan="2">field tripe</td>

        </tr>
    </table>
</body>

</html>
